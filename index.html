<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contec Dashboard</title>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --hover-bg: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --radius: 12px;
      --border-color: #334155;
      --progress-offset-y: 0px;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    html::-webkit-scrollbar, body::-webkit-scrollbar { width: 0; height: 0; }

    .cover-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-image: url('Quer_schwarzer_Hintergrund.png');
      background-color: #000;
      background-size: cover;
      background-position: center;
      mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
    }

    .container {
      max-width: 700px;
      margin: -35px auto 0;
      padding: 20px;
      position: relative;
      z-index: 10;
    }

    h1 {
      margin: 0 0 25px 0;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.5);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
    }

    .section-title {
      color: var(--text-muted);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .sort-btn {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sort-btn:hover {
      background: var(--hover-bg);
      border-color: var(--accent);
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      background: var(--hover-bg);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      border-color: #475569;
    }

    .card-content { 
      flex: 1; 
      max-width: calc(100% - 100px);
    }

    .card-title {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      font-size: 1.1rem;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .progress-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex: 1;
      margin-right: 50px;
      margin-top: var(--progress-offset-y);
    }

    .progress {
      height: 10px;
      background: #0f172a;
      border-radius: 10px;
      flex: 1;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      white-space: nowrap;
      margin-left: 15px;
    }

    .complete-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(59,130,246,0.15);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      z-index: 5;
    }

    .complete-btn:hover { transform: translateY(-50%) scale(1.05); box-shadow: 0 8px 22px rgba(59,130,246,0.22); }
    .complete-btn svg { width: 18px; height: 18px; }

    .card-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .meta-item {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .high { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
    .medium { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.4); }
    .low { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.4); }

    .add-card {
      background: transparent;
      border: 1px dashed var(--text-muted);
      justify-content: center;
      color: var(--text-muted);
      font-weight: 600;
    }
    .add-card:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      transform: none;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-content {
      background: #1e293b;
      width: 90%;
      max-width: 500px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid #475569;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }

    .confirm-modal-content {
      background: #1e293b;
      width: 90%;
      max-width: 400px;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid #475569;
      transform: translateY(20px);
      transition: transform 0.3s ease;
      text-align: center;
    }
    .modal-overlay.active .confirm-modal-content { transform: translateY(0); }

    .confirm-text {
      font-size: 1rem;
      margin-bottom: 24px;
      color: var(--text-main);
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn-confirm-cancel {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex: 1;
      transition: all 0.2s;
    }
    .btn-confirm-cancel:hover {
      background: var(--hover-bg);
      border-color: var(--accent);
    }

    .btn-confirm-delete {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex: 1;
      transition: all 0.2s;
    }
    .btn-confirm-delete:hover { background: #dc2626; }

    .modal-header {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.04);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.12s ease, transform 0.12s ease;
    }
    .modal-close-btn:hover { background: rgba(255,255,255,0.06); transform: scale(1.03); }
    .modal-close-btn svg { width: 16px; height: 16px; }

    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-family: inherit;
      box-sizing: border-box;
    }

    textarea { resize: vertical; min-height: 80px; }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    .slider-container { display: flex; align-items: center; gap: 15px; }

    input[type=range] {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      margin-top: -7px;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.5);
      transition: box-shadow 0.2s;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 10px;
      cursor: pointer;
      background: #0f172a;
      border-radius: 10px;
    }

    input[type=range]::-moz-range-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      margin-top: 0;
    }

    input[type=range]::-moz-range-track {
      background: #0f172a;
      border: none;
      border-radius: 10px;
      height: 10px;
    }

    .range-value {
      font-weight: bold;
      color: var(--accent);
      min-width: 45px;
      text-align: right;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-save {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex: 2;
    }
    .btn-save:hover { background: #2563eb; }

    .btn-delete {
      background: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 12px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex: 1;
    }
    .btn-delete:hover { background: rgba(239, 68, 68, 0.1); }

    @media (max-width: 600px) {
      :root { --progress-offset-y: 13px; }
      .card { gap: 8px; padding: 12px; }
      .card-content { flex: 1; max-width: calc(100% - 30px); }
      .progress-wrapper { margin-right: 60px; }
      .progress { min-width: 60px; }
      .complete-btn { width: 32px; height: px; }
      .badge { margin-left: 0; margin-top: 8px; }
      h1 { font-size: 2rem; }
    }
  </style>

  <script>
    const supabaseUrl = "https://utfzuuzoupzptzicsgaa.supabase.co";
    const supabaseKey = "sb_publishable_ErjfP9uKpkuGaPyixuPf2g_XZrFkSbc";

    const supabaseClient = window.supabase.createClient(
    supabaseUrl,
    supabaseKey
    );
  </script>
</head>

<body>
  <div class="cover-image"></div>

  <div class="container">
    <h1>To-Do Dashboard</h1>

    <div class="section-header">
      <div class="section-title">Anstehende Projekte</div>
      <button class="sort-btn" onclick="sortProjects()">⇅ Nach Priorität</button>
    </div>

    <div class="project-list" id="projectListContainer"></div>

    <div style="margin-top: 15px;">
      <div class="card add-card" onclick="openNewProjectModal()">
        + Neues Projekt hinzufügen
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="projectModal" onclick="closeModal(event)">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalHeaderTitle">Projekt bearbeiten</span>
        <button class="modal-close-btn" onclick="toggleModal()" aria-label="Schließen">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="form-group">
        <label>Projekt Name</label>
        <input type="text" id="modalTitleInput" placeholder="Name des Projekts">
      </div>

      <div class="form-group">
        <label>Fortschritt</label>
        <div class="slider-container">
          <input type="range" id="modalProgress" min="0" max="100" value="0" oninput="updateSliderValue(this.value)">
          <span id="sliderValue" class="range-value">0%</span>
        </div>
      </div>

      <div class="form-group">
        <label>Details & Notizen</label>
        <textarea id="modalNotes" placeholder="Was gibt es zu tun?"></textarea>
      </div>

      <div class="form-group">
        <label>Priorität</label>
        <select id="modalPriority">
          <option value="low">Niedrig</option>
          <option value="medium">Mittel</option>
          <option value="high">Hoch</option>
        </select>
      </div>

      <div class="form-group">
        <label>Zuständig</label>
        <select id="modalPerson">
          <option value="">Bitte wählen...</option>
          <option value="Niklas">Niklas</option>
          <option value="Bastian">Bastian</option>
          <option value="Tim">Tim</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fällig am</label>
        <input type="date" id="modalDate">
      </div>

      <div class="modal-actions">
        <button class="btn-delete" id="deleteBtn" onclick="deleteProject()">Löschen</button>
        <button class="btn-save" onclick="saveAndClose()">Speichern</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="confirmModal" onclick="closeConfirmModal(event)">
    <div class="confirm-modal-content">
      <div class="confirm-text">Möchtest du dieses Projekt wirklich löschen?</div>
      <div class="confirm-actions">
        <button class="btn-confirm-cancel" onclick="closeConfirmModal()">Abbrechen</button>
        <button class="btn-confirm-delete" onclick="confirmDelete()">Löschen</button>
      </div>
    </div>
  </div>

  <script>
    let currentCardId = null;
    let currentCardEl = null;
    let isCreatingNew = false;

    const sortModes = [
      { key: 'priority', label: 'Nach Priorität' },
      { key: 'progress', label: 'Nach Fortschritt' },
      { key: 'name', label: 'Nach Name' },
      { key: 'date-new', label: 'Neueste zuerst' },
      { key: 'date-old', label: 'Älteste zuerst' }
    ];
    let currentSortIndex = 0;

    function updateSortButtonLabel() {
      const btn = document.querySelector('.sort-btn');
      if (!btn) return;
      btn.innerText = '⇅ ' + sortModes[currentSortIndex].label;
    }

    function updateSliderValue(val) {
      document.getElementById('sliderValue').innerText = val + "%";
    }

    function openModal(cardId) {
      isCreatingNew = false;
      currentCardId = cardId;
      currentCardEl = document.getElementById(cardId);
      const card = document.getElementById(cardId);

      const title = card.querySelector('.data-title').value;
      const prio = card.querySelector('.data-prio').value;
      const progress = card.querySelector('.data-progress').value;
      const notes = card.querySelector('.data-notes') ? card.querySelector('.data-notes').value : "";
      const person = card.querySelector('.data-person') ? card.querySelector('.data-person').value : "";
      const date = card.querySelector('.data-date') ? card.querySelector('.data-date').value : "";

      document.getElementById('modalHeaderTitle').innerText = "Projekt bearbeiten";
      document.getElementById('modalTitleInput').value = title;
      document.getElementById('modalPriority').value = prio;
      document.getElementById('modalProgress').value = progress;
      document.getElementById('modalNotes').value = notes;
      document.getElementById('modalPerson').value = person;
      document.getElementById('modalDate').value = date;

      document.getElementById('deleteBtn').style.display = 'block';

      const closePath = document.querySelector('.modal-close-btn svg path');
      if (closePath) closePath.setAttribute('d', 'M15 18l-6-6 6-6');

      updateSliderValue(progress);
      toggleModal();
    }

    function openNewProjectModal() {
    isCreatingNew = true;
    currentCardId = null;
    currentCardEl = null;

    document.getElementById('modalHeaderTitle').innerText = "Neues Projekt";
    document.getElementById('modalTitleInput').value = "";
    document.getElementById('modalPriority').value = "low";
    document.getElementById('modalProgress').value = 0;
    document.getElementById('modalNotes').value = "";
    document.getElementById('modalPerson').value = "";
    document.getElementById('modalDate').value = "";

    document.getElementById('deleteBtn').style.display = 'none';

    updateSliderValue(0);
    const closePathNew = document.querySelector('.modal-close-btn svg path');
    if (closePathNew) closePathNew.setAttribute('d', 'M15 6l-6 6 6 6');
    toggleModal();
    }

    async function saveAndClose() {
    try {
        const title = document.getElementById('modalTitleInput').value.trim();
        if (!title) { alert("Bitte einen Titel eingeben!"); return; }

        const newPrio = document.getElementById('modalPriority').value;
        const newProgress = parseInt(document.getElementById('modalProgress').value, 10) || 0;
        const newNotes = document.getElementById('modalNotes').value || "";
        const newPerson = document.getElementById('modalPerson').value || "";
        const newDate = document.getElementById('modalDate').value || null;

        let res;

        if (isCreatingNew) {
        res = await supabaseClient.from("projects").insert([{
            title: title,
            priority: newPrio,
            progress: newProgress,
            notes: newNotes,
            person: newPerson,
            date: newDate
        }]);
        } else {
        res = await supabaseClient.from("projects").update({
            title: title,
            priority: newPrio,
            progress: newProgress,
            notes: newNotes,
            person: newPerson,
            date: newDate
        }).eq("id", currentCardId);
        }

        if (res.error) {
        console.error("Supabase Fehler:", res.error);
        alert("Supabase Fehler: " + res.error.message);
        return;
        }

        toggleModal();
        await loadProjects();

    } catch (e) {
        console.error("Unerwarteter Fehler:", e);
        alert("Unerwarteter Fehler: " + (e?.message || e));
    }
    }

    function deleteProject() {
    document.getElementById('confirmModal').classList.add('active');
    }

    

    async function confirmDelete() {
      const { error } = await supabaseClient
        .from("projects")
        .delete()
        .eq("id", currentCardId);

      if (error) {
        console.error("Delete Fehler:", error);
        alert("Löschen fehlgeschlagen. Schau in die Konsole.");
        closeConfirmModal();
        return;
      }

      currentCardId = null;
      currentCardEl = null;
      closeConfirmModal();
      document.getElementById('projectModal').classList.remove('active');
      await loadProjects();
    }

    function closeConfirmModal(event) {
      if (event && event.target.id !== 'confirmModal') return;
      document.getElementById('confirmModal').classList.remove('active');
    }

    function sortProjects() {
      currentSortIndex = (currentSortIndex + 1) % sortModes.length;
      updateSortButtonLabel();

      const mode = sortModes[currentSortIndex].key;
      const list = document.getElementById('projectListContainer');
      const cards = Array.from(list.getElementsByClassName('project-card'));

      function getPrioValue(card) {
        const p = card.querySelector('.data-prio') ? card.querySelector('.data-prio').value : 'low';
        return { 'high': 3, 'medium': 2, 'low': 1 }[p] || 1;
      }

      function getProgressValue(card) {
        const v = card.querySelector('.data-progress') ? parseFloat(card.querySelector('.data-progress').value) : 0;
        return isNaN(v) ? 0 : v;
      }

      function getTitle(card) {
        return card.querySelector('.data-title') ? card.querySelector('.data-title').value.toLowerCase() : '';
      }

      function getDateValueForMode(card, mode) {
        const ds = card.querySelector('.data-date') ? card.querySelector('.data-date').value : '';
        if (!ds) return mode === 'date-new' ? -Infinity : Infinity;
        const t = new Date(ds).getTime();
        return isNaN(t) ? (mode === 'date-new' ? -Infinity : Infinity) : t;
      }

      cards.sort((a, b) => {
        if (mode === 'priority') return getPrioValue(b) - getPrioValue(a);
        if (mode === 'progress') return getProgressValue(b) - getProgressValue(a);
        if (mode === 'name') {
          const A = getTitle(a), B = getTitle(b);
          return A < B ? -1 : A > B ? 1 : 0;
        }
        if (mode === 'date-new') return getDateValueForMode(b, mode) - getDateValueForMode(a, mode);
        if (mode === 'date-old') return getDateValueForMode(a, mode) - getDateValueForMode(b, mode);
        return 0;
      });

      cards.forEach(card => list.appendChild(card));
    }

    function toggleModal() {
      document.getElementById('projectModal').classList.toggle('active');
    }

    function closeModal(event) {
      if (event.target.id === 'projectModal') toggleModal();
    }

    async function completeProject(event, cardId) {
      event.stopPropagation();

      const { error } = await supabaseClient
        .from("projects")
        .delete()
        .eq("id", cardId);

      if (error) {
        console.error("Complete/Delete Fehler:", error);
        alert("Konnte nicht abschließen/löschen.");
        return;
      }

      await loadProjects();
    }

    async function loadProjects() {
      const { data, error } = await supabaseClient
        .from("projects")
        .select("*")
        .order("created_at", { ascending: true });

      if (error) {
        console.error("Fehler:", error);
        return;
      }

      const list = document.getElementById("projectListContainer");
      list.innerHTML = "";

      data.forEach(project => {
        const badgeText =
          project.priority === "high" ? "Hoch" :
          project.priority === "medium" ? "Mittel" : "Niedrig";

        const displayPerson = project.person ? project.person : "–";
        const displayDate = project.date ? project.date : "–";

        const html = `
          <div class="card project-card" id="${project.id}" onclick="openModal('${project.id}')">
            <div class="card-content">
              <span class="card-title">${project.title}</span>
              <div class="progress-wrapper">
                <div class="progress">
                  <div class="progress-bar" style="width: ${project.progress || 0}%"></div>
                </div>
                <span class="progress-text">${project.progress || 0}%</span>
              </div>
              <div class="card-meta">
                <div class="badge ${project.priority}">${badgeText}</div>
                <div class="meta-item person">${displayPerson}</div>
                <div class="meta-item date">${displayDate}</div>
              </div>
            </div>

            <button class="complete-btn" onclick="completeProject(event, '${project.id}')" aria-label="Aufgabe abschließen">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M20 6L9 17l-5-5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>

            <input type="hidden" class="data-title" value="${project.title}">
            <input type="hidden" class="data-prio" value="${project.priority}">
            <input type="hidden" class="data-progress" value="${project.progress || 0}">
            <input type="hidden" class="data-person" value="${project.person || ""}">
            <input type="hidden" class="data-date" value="${project.date || ""}">
            <input type="hidden" class="data-notes" value="${project.notes || ""}">
          </div>
        `;
        list.insertAdjacentHTML("beforeend", html);
      });
    }

    function startRealtime() {
    supabaseClient
        .channel("projects-realtime")
        .on(
        "postgres_changes",
        { event: "*", schema: "public", table: "projects" },
        (payload) => {
            console.log("Realtime Update:", payload);
            loadProjects(); // lädt alles neu
        }
        )
        .subscribe();
    }

    window.addEventListener("DOMContentLoaded", () => {
      updateSortButtonLabel();
      loadProjects();
      startRealtime(); 
    });
  </script>
</body>
</html>
